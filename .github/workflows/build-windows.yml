name: Build KMW TUNES v3

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target KMW_TUNES_VST3

      - name: Upload KMW TUNES
        uses: actions/upload-artifact@v4
        with:
          name: KMW-TUNES-v3-Windows
          path: build/KMW_TUNES_artefacts/Release/VST3/KMW TUNES.vst3
